###################
### KEYBINDINGS ###
###################

bind = $mainMod, tab, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, p, exec, wlogout
bind = $mainMod, f, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, d, exec, vesktop
bind = $mainMod, e, exec, code
bind = $mainMod, f9, exec, hyprshot -m region
bind = $mainMod, z, exec, zen-browser
bind = $mainMod, f10, exec, pavucontrol
bind = $mainMod, G, exec, steam
bind = $mainMod, m, exec, io.mrarm.mcpelauncher
bind = $mainMod, s, exec, spotify
bind = $mainMod, w, exec, pgrep -x waybar && pkill -x waybar || ~/.config/waybar/waybar.sh

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace (SHIFT + number)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

#############################
### OPACITY CONTROLS ###
#############################

bind = $mainMod, mouse:274, exec, hyprctl dispatch setprop activewindow opacity 1

bind = $mainMod CTRL, Up, exec, ~/.config/hypr/scripts/global-opacity.sh active_up
bind = $mainMod CTRL, Down, exec, ~/.config/hypr/scripts/global-opacity.sh active_down
bind = $mainMod CTRL SHIFT, Up, exec, ~/.config/hypr/scripts/global-opacity.sh inactive_up
bind = $mainMod CTRL SHIFT, Down, exec, ~/.config/hypr/scripts/global-opacity.sh inactive_down

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Automation controls
bind = $mainMod, f1, exec, python /home/l0wk3y/macro/robloxMacro.py > /home/l0wk3y/macro/log.txt 2>&1
bind = $mainMod, f2, exec, pkill -f robloxMacro.py && notify-send "Bot Stopped"
bind = $mainMod, f3, exec, dolphin ~/path/to/your/bot_images/

# MangoHud FPS limits
bind = $mainMod ALT, 0, exec, sed -i 's/fps_limit=.*/fps_limit=0/' ~/.config/MangoHud/MangoHud.conf && notify-send -a "System" -i "games" "FPS Limiter" "Framerate Uncapped"
bind = $mainMod ALT, 1, exec, sed -i 's/fps_limit=.*/fps_limit=10/' ~/.config/MangoHud/MangoHud.conf && notify-send -a "System" -i "games" "FPS Limiter" "Locked to 10 FPS"
bind = $mainMod ALT, 3, exec, sed -i 's/fps_limit=.*/fps_limit=30/' ~/.config/MangoHud/MangoHud.conf && notify-send -a "System" -i "games" "FPS Limiter" "Locked to 30 FPS"
bind = $mainMod ALT, 6, exec, sed -i 's/fps_limit=.*/fps_limit=60/' ~/.config/MangoHud/MangoHud.conf && notify-send -a "System" -i "games" "FPS Limiter" "Locked to 60 FPS"
bind = $mainMod ALT, 4, exec, sed -i 's/fps_limit=.*/fps_limit=144/' ~/.config/MangoHud/MangoHud.conf && notify-send -a "System" -i "games" "FPS Limiter" "Locked to 144 FPS"

# Volume + brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
